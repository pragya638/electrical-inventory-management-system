# Test profile: in-memory H2 so the suite runs without a MySQL server.
# The seed data loader is disabled so each test controls its own fixtures.
spring.datasource.url=jdbc:h2:mem:inventory_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.seed.enabled=false

logging.level.org.springframework=ERROR
logging.level.org.hibernate=WARN
