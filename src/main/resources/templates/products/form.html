<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${formTitle})}">
    <meta charset="UTF-8">
    <title>Product form | Electrical Inventory</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('products')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${formTitle}">Product</h1>
            <p class="page-subtitle">
                Product code is unique and cannot be changed to a code already in use.
            </p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/products}">Back to list</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" th:action="${formAction}" th:object="${productForm}"
                  novalidate>
                <div class="row g-3">

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="productCode">
                            Product Code <span class="required-mark">*</span>
                        </label>
                        <input type="text" id="productCode" th:field="*{productCode}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('productCode')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('productCode')}"
                             th:errors="*{productCode}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="name">
                            Product Name <span class="required-mark">*</span>
                        </label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="categoryId">
                            Category <span class="required-mark">*</span>
                        </label>
                        <select id="categoryId" th:field="*{categoryId}" class="form-select">
                            <option value="">-- Select category --</option>
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}">Category</option>
                        </select>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('categoryId')}"
                             th:errors="*{categoryId}">error</div>
                    </div>

                    <div class="col-6 col-md-3">
                        <label class="form-label" for="unit">
                            Unit <span class="required-mark">*</span>
                        </label>
                        <input type="text" id="unit" th:field="*{unit}" class="form-control"
                               list="unitList"
                               th:classappend="${#fields.hasErrors('unit')} ? 'is-invalid'">
                        <datalist id="unitList">
                            <option th:each="unitOption : ${units}" th:value="${unitOption}"></option>
                        </datalist>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('unit')}"
                             th:errors="*{unit}">error</div>
                    </div>

                    <div class="col-6 col-md-3">
                        <label class="form-label" for="reorderLevel">
                            Reorder Level <span class="required-mark">*</span>
                        </label>
                        <input type="number" id="reorderLevel" th:field="*{reorderLevel}"
                               min="0" class="form-control"
                               th:classappend="${#fields.hasErrors('reorderLevel')} ? 'is-invalid'">
                        <div class="form-text">Low stock when quantity is at or below this.</div>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('reorderLevel')}"
                             th:errors="*{reorderLevel}">error</div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="description">Description</label>
                        <textarea id="description" th:field="*{description}" rows="3"
                                  class="form-control"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}">error</div>
                    </div>

                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active"
                                   th:field="*{active}">
                            <label class="form-check-label" for="active">
                                Active &mdash; an inactive product cannot receive stock
                            </label>
                        </div>
                    </div>

                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/tail :: tail}"></footer>
<th:block th:replace="~{fragments/tail :: scripts}"></th:block>
</body>
</html>
