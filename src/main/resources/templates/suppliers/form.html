<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${formTitle})}">
    <meta charset="UTF-8">
    <title>Supplier form | Electrical Inventory</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('suppliers')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${formTitle}">Supplier</h1>
            <p class="page-subtitle">Supplier codes are unique across the system.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/suppliers}">Back to list</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" th:action="${formAction}" th:object="${supplierForm}" novalidate>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="supplierCode">
                            Supplier Code <span class="required-mark">*</span>
                        </label>
                        <input type="text" id="supplierCode" th:field="*{supplierCode}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('supplierCode')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('supplierCode')}"
                             th:errors="*{supplierCode}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="name">
                            Supplier Name <span class="required-mark">*</span>
                        </label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="contactPerson">Contact Person</label>
                        <input type="text" id="contactPerson" th:field="*{contactPerson}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('contactPerson')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('contactPerson')}"
                             th:errors="*{contactPerson}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="phone">Phone</label>
                        <input type="text" id="phone" th:field="*{phone}" class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('phone')}"
                             th:errors="*{phone}">error</div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="address">Address</label>
                        <textarea id="address" th:field="*{address}" rows="2" class="form-control"
                                  th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('address')}"
                             th:errors="*{address}">error</div>
                    </div>

                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active"
                                   th:field="*{active}">
                            <label class="form-check-label" for="active">Active</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/suppliers}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/tail :: tail}"></footer>
<th:block th:replace="~{fragments/tail :: scripts}"></th:block>
</body>
</html>
