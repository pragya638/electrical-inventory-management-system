<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${plant.name})}">
    <meta charset="UTF-8">
    <title>Plant view | Electrical Inventory</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('plants')}"></nav>

<main class="container-fluid py-4 px-lg-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${plant.name}">Plant</h1>
            <p class="page-subtitle">Plant detail and stock held at this location.</p>
        </div>
        <div class="d-flex gap-2 no-print">
            <a class="btn btn-outline-primary"
               sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')"
               th:href="@{/plants/{id}/edit(id=${plant.id})}">Edit</a>
            <a class="btn btn-outline-secondary" th:href="@{/plants}">Back to list</a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-12 col-lg-4">
            <div class="card h-100">
                <div class="card-header">Details</div>
                <div class="card-body">
                    <table class="table table-sm mb-0">
                        <tbody>
                        <tr>
                            <th scope="row" style="width: 45%">Name</th>
                            <td th:text="${plant.name}">Name</td>
                        </tr>
                        <tr>
                            <th scope="row">Location</th>
                            <td th:text="${plant.location} ?: '-'">-</td>
                        </tr>
                        <tr>
                            <th scope="row">Contact Person</th>
                            <td th:text="${plant.contactPerson} ?: '-'">-</td>
                        </tr>
                        <tr>
                            <th scope="row">Contact Number</th>
                            <td th:text="${plant.contactNumber} ?: '-'">-</td>
                        </tr>
                        <tr>
                            <th scope="row">Status</th>
                            <td th:replace="~{fragments/alerts :: activeBadge(${plant.active})}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card h-100">
                <div class="card-header">Stock at this Plant</div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover mb-0">
                        <thead>
                        <tr>
                            <th>Code</th>
                            <th>Product</th>
                            <th class="text-end">Quantity</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${stockRows}">
                            <td class="fw-semibold" th:text="${row.productCode}">CODE</td>
                            <td>
                                <a class="text-decoration-none"
                                   th:href="@{/products/{id}(id=${row.productId})}"
                                   th:text="${row.productName}">Name</a>
                            </td>
                            <td class="text-end" th:text="${row.quantity}">0</td>
                            <td th:replace="~{fragments/alerts :: stockBadge(${row.status})}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(stockRows)}">
                            <td colspan="4" class="empty-state">No stock recorded for this plant.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/tail :: tail}"></footer>
<th:block th:replace="~{fragments/tail :: scripts}"></th:block>
</body>
</html>
