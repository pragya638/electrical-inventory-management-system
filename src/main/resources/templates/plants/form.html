<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${formTitle})}">
    <meta charset="UTF-8">
    <title>Plant form | Electrical Inventory</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('plants')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${formTitle}">Plant</h1>
            <p class="page-subtitle">A plant is a physical location that holds stock.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/plants}">Back to list</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" th:action="${formAction}" th:object="${plantForm}" novalidate>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="name">
                            Plant Name <span class="required-mark">*</span>
                        </label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="location">Location</label>
                        <input type="text" id="location" th:field="*{location}" class="form-control"
                               th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('location')}"
                             th:errors="*{location}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="contactPerson">Contact Person</label>
                        <input type="text" id="contactPerson" th:field="*{contactPerson}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('contactPerson')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('contactPerson')}"
                             th:errors="*{contactPerson}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="contactNumber">Contact Number</label>
                        <input type="text" id="contactNumber" th:field="*{contactNumber}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('contactNumber')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('contactNumber')}"
                             th:errors="*{contactNumber}">error</div>
                    </div>

                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active"
                                   th:field="*{active}">
                            <label class="form-check-label" for="active">Active</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/plants}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/tail :: tail}"></footer>
<th:block th:replace="~{fragments/tail :: scripts}"></th:block>
</body>
</html>
