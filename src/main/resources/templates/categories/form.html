<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${formTitle})}">
    <meta charset="UTF-8">
    <title>Category form | Electrical Inventory</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('categories')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${formTitle}">Category</h1>
            <p class="page-subtitle">Category names are unique across the system.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/categories}">Back to list</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" th:action="${formAction}" th:object="${categoryForm}" novalidate>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="name">
                            Category Name <span class="required-mark">*</span>
                        </label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">error</div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="description">Description</label>
                        <textarea id="description" th:field="*{description}" rows="3"
                                  class="form-control"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}">error</div>
                    </div>

                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active"
                                   th:field="*{active}">
                            <label class="form-check-label" for="active">Active</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/categories}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/tail :: tail}"></footer>
<th:block th:replace="~{fragments/tail :: scripts}"></th:block>
</body>
</html>
