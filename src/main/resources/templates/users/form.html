<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${formTitle})}">
    <meta charset="UTF-8">
    <title>User form | Electrical Inventory</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('users')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${formTitle}">User</h1>
            <p class="page-subtitle">
                Email must be unique. Leave the password blank when editing to keep the current one.
            </p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/users}">Back to list</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" th:action="${formAction}" th:object="${userForm}" novalidate>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="name">
                            Name <span class="required-mark">*</span>
                        </label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}" th:errors="*{name}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="email">
                            Email <span class="required-mark">*</span>
                        </label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}" th:errors="*{email}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="role">
                            Role <span class="required-mark">*</span>
                        </label>
                        <select id="role" th:field="*{role}" class="form-select"
                                th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                            <option th:each="roleOption : ${roles}" th:value="${roleOption.name()}"
                                    th:text="${roleOption}">ROLE</option>
                        </select>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('role')}" th:errors="*{role}">error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" th:field="*{password}"
                               class="form-control" autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                        <div class="form-text">Stored as a BCrypt hash, never as plain text.</div>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}">error</div>
                    </div>

                    <div class="col-12">
                        <!-- th:field on a checkbox also emits the hidden "_active"
                             input that Spring uses to tell "unticked" from "missing". -->
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active"
                                   th:field="*{active}" value="true">
                            <label class="form-check-label" for="active">Active</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/users}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/tail :: tail}"></footer>
<th:block th:replace="~{fragments/tail :: scripts}"></th:block>
</body>
</html>
