<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Shared page footer plus the two script tags every page needs. Kept in one
     fragment so the disclaimer text exists in exactly one place. -->
<footer th:fragment="tail" class="container-fluid px-lg-4 pb-4 text-muted small no-print">
    <hr>
    <p class="mb-0">
        Internship-level prototype. All company, plant, supplier and product records shown are
        demonstration data and do not represent real operational data.
    </p>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
