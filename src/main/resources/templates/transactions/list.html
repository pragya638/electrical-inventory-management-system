<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Transaction History')}">
    <meta charset="UTF-8">
    <title>Transactions | Electrical Inventory</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('transactions')}"></nav>

<main class="container-fluid py-4 px-lg-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-header no-print">
        <div>
            <h1 class="page-title">Transaction History</h1>
            <p class="page-subtitle">
                Every successful Stock IN and Stock OUT movement, newest first.
            </p>
        </div>
        <a class="btn btn-outline-secondary no-print"
           th:href="@{/reports/export/transactions.csv}">Export CSV</a>
    </div>

    <form class="filter-bar mb-3 no-print" method="get" th:action="@{/transactions}">
        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-2">
                <label class="form-label" for="type">Type</label>
                <select id="type" name="type" class="form-select">
                    <option value="">All</option>
                    <option value="IN" th:selected="${filter.type != null
                        and filter.type.name() == 'IN'}">IN</option>
                    <option value="OUT" th:selected="${filter.type != null
                        and filter.type.name() == 'OUT'}">OUT</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="productId">Product</label>
                <select id="productId" name="productId" class="form-select">
                    <option value="">All products</option>
                    <option th:each="product : ${products}" th:value="${product.id}"
                            th:text="${product.productCode}"
                            th:selected="${filter.productId != null
                                      and filter.productId == product.id}">Product</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="plantId">Plant</label>
                <select id="plantId" name="plantId" class="form-select">
                    <option value="">All plants</option>
                    <option th:each="plant : ${plants}" th:value="${plant.id}"
                            th:text="${plant.name}"
                            th:selected="${filter.plantId != null
                                      and filter.plantId == plant.id}">Plant</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="from">From</label>
                <input type="date" id="from" name="from" class="form-control"
                       th:value="${filter.from}">
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="to">To</label>
                <input type="date" id="to" name="to" class="form-control"
                       th:value="${filter.to}">
            </div>
            <div class="col-12 col-md-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Apply</button>
                <a class="btn btn-outline-secondary" th:href="@{/transactions}">Reset</a>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Txn ID</th>
                    <th>Product</th>
                    <th>Plant</th>
                    <th>Type</th>
                    <th class="text-end">Quantity</th>
                    <th>Reference Number</th>
                    <th>Remarks</th>
                    <th>Date</th>
                    <th>Performed By</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="txn : ${transactions}">
                    <td class="text-muted" th:text="${txn.id}">0</td>
                    <td>
                        <span class="fw-semibold" th:text="${txn.productCode}">CODE</span>
                        <span class="text-muted small d-block" th:text="${txn.productName}"></span>
                    </td>
                    <td th:text="${txn.plantName}">Plant</td>
                    <td>
                        <span class="badge"
                              th:classappend="${txn.transactionType.name() == 'IN'}
                                  ? 'text-bg-success' : 'text-bg-danger'"
                              th:text="${txn.transactionType}">IN</span>
                    </td>
                    <td class="text-end fw-semibold"
                        th:classappend="${txn.transactionType.name() == 'IN'}
                            ? 'text-success' : 'text-danger'"
                        th:text="${txn.quantity}">0</td>
                    <td th:text="${txn.referenceNumber} ?: '-'">-</td>
                    <td class="text-muted small" th:text="${txn.remarks} ?: '-'">-</td>
                    <td th:text="${txn.transactionDate}">date</td>
                    <td class="small" th:text="${txn.performedBy}">user</td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="9" class="empty-state">
                        No transactions match the current filter.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/tail :: tail}"></footer>
<th:block th:replace="~{fragments/tail :: scripts}"></th:block>
</body>
</html>
