<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${reportTitle})}">
    <meta charset="UTF-8">
    <title>Report | Electrical Inventory</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('reports')}"></nav>

<main class="container-fluid py-4 px-lg-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-header no-print">
        <div>
            <h1 class="page-title" th:text="${reportTitle}">Report</h1>
            <p class="page-subtitle">Prototype data. Print-friendly layout.</p>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary" onclick="window.print()">
                Print
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/reports}">All reports</a>
        </div>
    </div>

    <!-- Date range filter. Posts back to whichever report page is being viewed. -->
    <form class="filter-bar mb-3 no-print" method="get" th:action="@{${#httpServletRequest.requestURI}}">
        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-3">
                <label class="form-label" for="from">From date</label>
                <input type="date" id="from" name="from" class="form-control" th:value="${from}">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="to">To date</label>
                <input type="date" id="to" name="to" class="form-control" th:value="${to}">
            </div>
            <div class="col-12 col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Apply</button>
                <a class="btn btn-outline-secondary"
                   th:href="@{${#httpServletRequest.requestURI}}">Reset</a>
            </div>
        </div>
    </form>

    <div class="print-header">
        <h2 th:text="${reportTitle}">Report</h2>
        <p th:if="${from != null or to != null}" class="small">
            Range:
            <span th:text="${from} ?: 'start'"></span> to
            <span th:text="${to} ?: 'today'"></span>
        </p>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead>
                <tr>
                    <th>Txn ID</th>
                    <th>Product</th>
                    <th>Plant</th>
                    <th>Type</th>
                    <th class="text-end">Quantity</th>
                    <th>Reference</th>
                    <th>Remarks</th>
                    <th>Date</th>
                    <th>Performed By</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="txn : ${rows}">
                    <td class="text-muted" th:text="${txn.id}">0</td>
                    <td>
                        <span class="fw-semibold" th:text="${txn.productCode}">CODE</span>
                        <span class="text-muted small d-block" th:text="${txn.productName}"></span>
                    </td>
                    <td th:text="${txn.plantName}">Plant</td>
                    <td>
                        <span class="badge"
                              th:classappend="${txn.transactionType.name() == 'IN'}
                                  ? 'text-bg-success' : 'text-bg-danger'"
                              th:text="${txn.transactionType}">IN</span>
                    </td>
                    <td class="text-end" th:text="${txn.quantity}">0</td>
                    <td th:text="${txn.referenceNumber} ?: '-'">-</td>
                    <td class="text-muted small" th:text="${txn.remarks} ?: '-'">-</td>
                    <td th:text="${txn.transactionDate}">date</td>
                    <td class="small" th:text="${txn.performedBy}">user</td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td colspan="9" class="empty-state">
                        No transactions in the selected range.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/tail :: tail}"></footer>
<th:block th:replace="~{fragments/tail :: scripts}"></th:block>
</body>
</html>
