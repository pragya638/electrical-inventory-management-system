<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${reportTitle})}">
    <meta charset="UTF-8">
    <title>Report | Electrical Inventory</title>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('reports')}"></nav>

<main class="container-fluid py-4 px-lg-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="page-header no-print">
        <div>
            <h1 class="page-title" th:text="${reportTitle}">Report</h1>
            <p class="page-subtitle">Prototype data. Print-friendly layout.</p>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary" onclick="window.print()">
                Print
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/reports}">All reports</a>
        </div>
    </div>

    <div class="print-header">
        <h2 th:text="${reportTitle}">Report</h2>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead>
                <tr>
                    <th>Product Code</th>
                    <th>Product</th>
                    <th>Plant</th>
                    <th class="text-end">Quantity</th>
                    <th>Unit</th>
                    <th class="text-end">Reorder Level</th>
                    <th>Status</th>
                    <th>Last Updated</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td class="fw-semibold" th:text="${row.productCode}">CODE</td>
                    <td th:text="${row.productName}">Product</td>
                    <td th:text="${row.plantName}">Plant</td>
                    <td class="text-end" th:text="${row.quantity}">0</td>
                    <td th:text="${row.unit}">Unit</td>
                    <td class="text-end" th:text="${row.reorderLevel}">0</td>
                    <td th:replace="~{fragments/alerts :: stockBadge(${row.status})}"></td>
                    <td class="text-muted small" th:text="${row.lastUpdated}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td colspan="8" class="empty-state">No rows to report.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/tail :: tail}"></footer>
<th:block th:replace="~{fragments/tail :: scripts}"></th:block>
</body>
</html>
