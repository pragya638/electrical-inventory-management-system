# ---------------------------------------------------------------------------
# Electrical Inventory & Stock Management System
# Prototype configuration. Every company, plant, supplier and product name
# present in the seeded data is DEMONSTRATION DATA only.
#
# Database credentials are NEVER stored in this file. Set the environment
# variables DB_URL, DB_USERNAME and DB_PASSWORD before starting the app
# (see README.md -> "Setup instructions"). The application starts without a
# database password only if your MySQL user has one - which is not the case
# for a normal local install, so exporting the variable is required.
# ---------------------------------------------------------------------------
spring.application.name=inventory-management-system

# --- MySQL -----------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wonder_electricals_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate -------------------------------------------------------
# ddl-auto=update is a development convenience: Hibernate creates or extends the
# tables on start-up. A production deployment should switch to `validate` and
# apply schema changes with migration scripts instead.
spring.jpa.hibernate.ddl-auto=update
# open-in-view=false keeps the session closed when a request finishes. Every
# service maps entities to DTOs inside its transaction, so no lazy association
# is touched after the fact and LazyInitializationException cannot occur.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf -------------------------------------------------------------
spring.thymeleaf.cache=false

# --- Demo data seeding -----------------------------------------------------
# Runs only when the database contains no users. Set to false to start empty.
app.seed.enabled=${APP_SEED_ENABLED:true}

# --- Logging ---------------------------------------------------------------
logging.level.org.springframework.security=INFO
